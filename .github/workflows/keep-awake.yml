# Free Hugging Face Spaces sleep after 48 hours without visitors, and the next
# visitor then waits 1-2 minutes. One request a day keeps the Space awake.
# Set the repo variable DOCIQ_SPACE_URL (e.g. https://<you>-dociq.hf.space).
name: keep-awake

on:
  schedule:
    - cron: "30 11 * * *"   # daily 11:30 UTC = 17:00 IST
  workflow_dispatch:

jobs:
  wake:
    if: vars.DOCIQ_SPACE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space (a sleeping Space takes ~1-2 min to start)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 "${{ vars.DOCIQ_SPACE_URL }}/api/workspaces/demo" && exit 0 || sleep 30
          done
          echo "Space did not answer" && exit 1
